# Cloud Build CI/CD Pipeline for Autonomous Google Cloud WAF Auditor
# Executes: 1) Pytest Suite (Critic AST/URI + SkillLoader + Pub/Sub Push)
#           2) Terraform Format & Schema Validation
#           3) Docker Image Build & Artifact Registry Push
#           4) Cloud Run v2 Deployment

substitutions:
  _REGION: us-central1
  _AR_REPO: waf-auditor
  _SERVICE_NAME: waf-auditor-agent

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # Step 1: Run Unit & Async Integration Tests via uv
  - name: "ghcr.io/astral-sh/uv:python3.12-bookworm-slim"
    id: "pytest-validation"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        uv run --extra dev pytest -v -k "not asyncio" && \
        uv run --extra dev pytest tests/test_pubsub_push.py tests/test_critic_loop.py -v -k "asyncio"

  # Step 2: Validate Terraform Infrastructure as Code
  - name: "hashicorp/terraform:1.9"
    id: "terraform-validate"
    dir: "terraform"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        terraform fmt -check && \
        terraform init -backend=false && \
        terraform validate

  # Step 3: Build Container Image
  - name: "gcr.io/cloud-builders/docker"
    id: "docker-build"
    waitFor: ["pytest-validation", "terraform-validate"]
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/agent:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/agent:latest"
      - "."

  # Step 4: Push Container Image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    id: "docker-push"
    waitFor: ["docker-build"]
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/agent"

  # Step 5: Deploy Updated Revision to Cloud Run v2
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "cloud-run-deploy"
    waitFor: ["docker-push"]
    entrypoint: "gcloud"
    args:
      - "run"
      - "services"
      - "update"
      - "${_SERVICE_NAME}"
      - "--project=${PROJECT_ID}"
      - "--region=${_REGION}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/agent:${SHORT_SHA}"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/agent:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/agent:latest"
